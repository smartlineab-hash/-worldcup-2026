function App() {

    <div style={{minHeight:"100vh",background:"#080c18",color:"#e2e8f0",maxWidth:900,margin:"0 auto",display:"flex",flexDirection:"column"}}>
      {toast&&<div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:"#1e293b",border:"1px solid #f97316",color:"#fff",padding:"12px 20px",borderRadius:12,fontSize:14,fontWeight:600,zIndex:999,boxShadow:"0 4px 24px #0008",whiteSpace:"nowrap"}}>{toast}</div>}

              <div key={p.name} style={{display:"flex",alignItems:"center",gap:11,background:"#111827",borderRadius:10,padding:13,marginBottom:9}}>
                <div style={{width:30,height:30,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:13,background:i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#b45309":"#1f2937",color:i<3?"#fff":"#64748b",flexShrink:0}}>{i+1}</div>
                <span style={{fontSize:28}}>{p.flag}</span>
                <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:4}}>{p.name}</div><div style={{fontSize:11,color:"#64748b"}}>في انتظار المباريات...</div></div>
                <span style={{background:"#f9731622",color:"#f97316",padding:"4px 10px",borderRadius:12,fontSize:13,fontWeight:700,border:"1px solid #f9731444"}}>0 ⚽</span>
              </div>
            ))}
          </div>
        )}
      </main>
    </div>
  );
}

function PredictGame({showToast}) {
  const [tab,setTab]=useState("predict");
  const [scores,setScores]=useState({});
  const [picks,setPicks]=useState({});
  const [submitted,setSubmitted]=useState({});
  const setScore=(id,side,val)=>{const n=Math.max(0,Math.min(9,parseInt(val)||0));setScores(s=>({...s,[`${id}-${side}`]:n}));};
  const submit=(id)=>{
    const g1=scores[`${id}-1`];const g2=scores[`${id}-2`];const pick=picks[id];
    const match=MATCHES_DATA.find(m=>m.id===id);
    if(g1==null||g2==null||!pick){showToast("⚠️ اختر النتيجة والفائز أولاً");return;}
    setSubmitted(s=>({...s,[id]:{g1,g2,pick}}));
    showToast(`✅ محفوظ! ${match.team1.flag} ${g1} - ${g2} ${match.team2.flag}`);
  };
  const count=Object.keys(submitted).length;const pts=count*5;
  return (
    <div style={{background:"#080c18",minHeight:"100vh"}}>
      <header style={{background:"linear-gradient(160deg,#0f1e3d,#0a0c18)",borderBottom:"2px solid #f97316",padding:"16px 18px 13px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:13}}>
          <div style={{display:"flex",alignItems:"center",gap:11}}>
            <span style={{fontSize:32}}>🎮</span>
            <div><div style={{fontSize:18,fontWeight:900,color:"#fff"}}>لعبة التوقعات</div><div style={{fontSize:9,color:"#f97316",marginTop:2}}>WORLD CUP 2026 · PREDICTOR</div></div>
          </div>
          <div style={{background:"#f9731622",border:"2px solid #f97316",borderRadius:11,padding:"7px 16px",textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:900,color:"#f97316",lineHeight:1}}>{pts}</div>
            <div style={{fontSize:9,color:"#f97316",marginTop:2}}>نقطة</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <span style={{fontSize:11,color:"#64748b",minWidth:88}}>{count}/{MATCHES_DATA.length} توقعات</span>
          <div style={{flex:1,height:5,background:"#1f2937",borderRadius:3,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${(count/MATCHES_DATA.length)*100}%`,background:"linear-gradient(90deg,#f97316,#fbbf24)",borderRadius:3,transition:"width 0.5s"}}/>
          </div>
        </div>
      </header>
      <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #1f2937"}}>
        {[["predict","🎮 توقعاتي"],["leaderboard","🏆 المتصدرين"],["rules","📋 القواعد"]].map(([k,lbl])=>(
          <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"11px 4px",background:"none",border:"none",borderBottom:tab===k?"3px solid #f97316":"3px solid transparent",color:tab===k?"#f97316":"#64748b",cursor:"pointer",fontSize:12,fontWeight:tab===k?700:400}}>{lbl}</button>
        ))}
      </div>
      <main style={{padding:"14px 13px"}}>
        {tab==="predict"&&MATCHES_DATA.map(match=>{
          const done=!!submitted[match.id];const sub=submitted[match.id];
          const g1=scores[`${match.id}-1`]??"";const g2=scores[`${match.id}-2`]??"";
          const pick=picks[match.id];
          return (
            <div key={match.id} style={{background:"#111827",border:"1px solid #1f2937",borderRadius:13,padding:15,marginBottom:13,borderTop:done?"3px solid #4ade80":"3px solid #1f2937"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:11}}>
                <span style={{fontSize:10,color:"#60a5fa"}}>📅 {match.date} · {match.time}</span>
                <span style={{fontSize:10,color:"#64748b"}}>🏟 {match.venue}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:13,gap:6}}>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:1}}>
                  <span style={{fontSize:34}}>{match.team1.flag}</span>
                  <span style={{fontSize:12,fontWeight:700,color:"#fff",textAlign:"center"}}>{match.team1.name}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  {done
                    ?<><span style={{width:50,height:50,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:900,color:"#4ade80",background:"#14532d22",border:"2px solid #4ade8044",borderRadius:9}}>{sub.g1}</span><span style={{fontSize:20,fontWeight:900,color:"#475569"}}>-</span><span style={{width:50,height:50,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:900,color:"#4ade80",background:"#14532d22",border:"2px solid #4ade8044",borderRadius:9}}>{sub.g2}</span></>
                    :<><input type="number" min="0" max="9" value={g1} onChange={e=>setScore(match.id,1,e.target.value)} placeholder="0" style={{width:50,height:50,textAlign:"center",fontSize:22,fontWeight:900,background:"#1e293b",border:"2px solid #334155",borderRadius:9,color:"#f97316",outline:"none"}}/><span style={{fontSize:20,fontWeight:900,color:"#475569"}}>-</span><input type="number" min="0" max="9" value={g2} onChange={e=>setScore(match.id,2,e.target.value)} placeholder="0" style={{width:50,height:50,textAlign:"center",fontSize:22,fontWeight:900,background:"#1e293b",border:"2px solid #334155",borderRadius:9,color:"#f97316",outline:"none"}}/></>
                  }
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:1}}>
                  <span style={{fontSize:34}}>{match.team2.flag}</span>
                  <span style={{fontSize:12,fontWeight:700,color:"#fff",textAlign:"center"}}>{match.team2.name}</span>
                </div>
              </div>
              {!done?(
                <>
                  <div style={{fontSize:11,color:"#64748b",marginBottom:7}}>من سيفوز؟</div>
                  <div style={{display:"flex",gap:7,marginBottom:11}}>
                    {[["team1",`${match.team1.flag} ${match.team1.name}`],["draw","🤝 تعادل"],["team2",`${match.team2.flag} ${match.team2.name}`]].map(([k,lbl])=>(
                      <button key={k} onClick={()=>setPicks(s=>({...s,[match.id]:k}))} style={{flex:1,padding:"8px 3px",background:pick===k?"#f9731622":"#1e293b",border:pick===k?"1px solid #f97316":"1px solid #334155",borderRadius:8,color:pick===k?"#f97316":"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:pick===k?700:600}}>{lbl}</button>
                    ))}
                  </div>
                  <button onClick={()=>submit(match.id)} style={{width:"100%",padding:"11px",background:"linear-gradient(90deg,#f97316,#ea580c)",border:"none",borderRadius:9,color:"#fff",fontSize:13,fontWeight:800,cursor:"pointer"}}>حفظ التوقع ⚡</button>
                </>
              ):(
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{background:"#14532d33",color:"#4ade80",padding:"5px 11px",borderRadius:20,fontSize:11,fontWeight:700}}>✅ محفوظ</span>
                  <span style={{fontSize:11,color:"#94a3b8"}}>{sub.pick==="draw"?"🤝 تعادل":sub.pick==="team1"?`${match.team1.flag} ${match.team1.name}`:`${match.team2.flag} ${match.team2.name}`}</span>
                </div>
              )}
            </div>
          );
        })}
        {tab==="leaderboard"&&(
          <div>
            <div style={{fontSize:15,fontWeight:800,color:"#fff",marginBottom:13}}>🏆 لوحة المتصدرين</div>
            <div style={{background:"linear-gradient(135deg,#1e1b4b,#0f172a)",border:"2px solid #6366f1",borderRadius:11,padding:"13px 15px",display:"flex",alignItems:"center",gap:11,marginBottom:8}}>
              <span style={{fontSize:22,fontWeight:900,color:"#6366f1",minWidth:36}}>#6</span>
              <div style={{flex:1}}><div style={{fontSize:15,fontWeight:700,color:"#fff"}}>أنت 👤</div><div style={{fontSize:11,color:"#94a3b8"}}>{count} توقعات مسجلة</div></div>
              <div style={{textAlign:"center"}}><div style={{fontSize:24,fontWeight:900,color:"#6366f1"}}>{pts}</div><div style={{fontSize:10,color:"#6366f1"}}>نقطة</div></div>
            </div>
            <div style={{height:1,background:"#1f2937",margin:"10px 0"}}/>
            {LEADERBOARD.map((lp,i)=>(
              <div key={lp.name} style={{display:"flex",alignItems:"center",gap:11,padding:11,background:"#111827",borderRadius:9,marginBottom:8}}>
                <span style={{fontSize:i<3?22:14,fontWeight:800,color:i<3?"#fff":"#64748b",minWidth:36,textAlign:"center"}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`}</span>
                <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:"#fff"}}>{lp.name}</div><div style={{fontSize:11,color:"#64748b"}}>{lp.correct} صح · {lp.exact} دقيقة</div></div>
                <div style={{fontSize:20,fontWeight:900,color:"#f97316"}}>{lp.pts}<span style={{fontSize:12}}> ن</span></div>
              </div>
            ))}
          </div>
        )}
        {tab==="rules"&&(
          <div style={{background:"#111827",border:"1px solid #1f2937",borderRadius:11,padding:16}}>
            <p style={{fontSize:14,color:"#94a3b8",marginBottom:16}}>توقع نتائج المباريات واجمع أكبر عدد من النقاط!</p>
            {[["توقعت الفائز ✅","+5 نقاط"],["توقعت النتيجة بالضبط 🎯","+10 نقاط"],["توقعت التعادل ✅","+5 نقاط"]].map(([lbl,p])=>(
              <div key={lbl} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 13px",background:"#1e293b",borderRadius:7,marginBottom:8}}>
                <span style={{fontSize:13}}>{lbl}</span><span style={{fontSize:13,fontWeight:800,color:"#f97316"}}>{p}</span>
              </div>
            ))}
            <div style={{background:"#f9731611",border:"1px solid #f9731633",borderRadius:7,padding:"9px 13px",fontSize:12,color:"#fbd38d",marginBottom:8}}>💡 توقع النتيجة بالضبط لتحصل على أعلى نقاط!</div>
            <div style={{background:"#60a5fa11",border:"1px solid #60a5fa33",borderRadius:7,padding:"9px 13px",fontSize:12,color:"#93c5fd"}}>⏰ يجب تسجيل التوقع قبل المباراة بـ 15 دقيقة</div>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
